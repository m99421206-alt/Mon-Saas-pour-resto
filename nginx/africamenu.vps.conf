# AfricaMenu — config VPS (HTTPS + Certbot)
# Copier vers : /etc/nginx/sites-available/africamenu

server {
  listen 80;
  listen [::]:80;
  server_name africamenu.com www.africamenu.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/africamenu;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name africamenu.com www.africamenu.com;

  root /var/www/africamenu;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/africamenu.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africamenu.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 64M;

  access_log /var/log/nginx/africamenu.access.log;
  error_log /var/log/nginx/africamenu.error.log warn;

  # --- API Express ---
  location /api/ {
    client_max_body_size 64M;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /upload {
    client_max_body_size 64M;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # --- Monitoring & SEO (NE PAS laisser tomber sur index.html) ---
  location = /health {
    proxy_pass http://127.0.0.1:4000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  location = /api/health {
    proxy_pass http://127.0.0.1:4000/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4000/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
    access_log off;
  }

  # --- Fichiers statiques ---
  location /uploads/ {
    alias /var/www/africamenu/backend/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location /css/ {
    alias /var/www/africamenu/frontend/css/;
    expires 7d;
  }

  location /js/ {
    alias /var/www/africamenu/frontend/js/;
    expires 7d;
  }

  # --- Menus publics (HTML) — pas de proxy API ici ---
  location /menu/ {
    try_files $uri $uri/ /frontend/pages/mon-menu.html;
  }

  location /restaurant/ {
    try_files $uri $uri/ /frontend/pages/mon-menu.html;
  }

  # Ancien format /<slug> → /restaurant/<slug>
  location ~ ^/(?!api/|uploads/|css/|js/|frontend/|assets/|restaurant/|menu/|upload|favicon\.ico|robots\.txt|sitemap\.xml|health)([^/.]+)$ {
    return 301 /restaurant/$1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
